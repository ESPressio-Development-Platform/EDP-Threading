name: BoundedTopology migration resource gate

on:
  pull_request:

jobs:
  measurements:
    if: github.head_ref == 'bounded_topology_migration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EDP-Threading
        uses: actions/checkout@v4
        with:
          path: EDP-Threading

      - name: Checkout EDP-System
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          ref: main
          path: EDP-System

      - name: Checkout EDP-Platform
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          ref: main
          path: EDP-Platform

      - name: Checkout EDP-Memory
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Memory
          ref: main
          path: EDP-Memory

      - name: Checkout EDP-Security
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Security
          ref: main
          path: EDP-Security

      - name: Checkout EDP-Clock
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Clock
          ref: main
          path: EDP-Clock

      - name: Checkout EDP-BoundedTopology
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          ref: main
          path: EDP-BoundedTopology

      - name: Checkout EDP-Platform-FreeRTOS
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-FreeRTOS
          ref: main
          path: EDP-Platform-FreeRTOS

      - name: Checkout EDP-Platform-ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform-ESP-IDF
          ref: main
          path: EDP-Platform-ESP-IDF

      - name: Install PIOArduino CLI
        run: |
          curl -fsSL -o get-platformio.py https://raw.githubusercontent.com/pioarduino/pioarduino-core-installer/pioarduino/get-platformio.py
          python3 get-platformio.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Run resource measurements
        env:
          EDP_THREADING_RESOURCE_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          bash EDP-Threading/tests/resource-measurements/run-resource-measurements.sh | tee resource-summary.log

      - name: Compare RAM against validated baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          baseline = {
              "idf_small_8x1": (5568, 668),
              "idf_representative_16x2": (10880, 1264),
              "idf_control_high": (3104, 252),
              "idf_dedicated_worker": (3064, 212),
              "idf_dedicated_thread": (4972, 72),
              "idf_mixed": (19152, 1180),
              "arduino_small_8x1": (5624, 672),
              "arduino_representative_16x2": (10968, 1264),
              "arduino_control_high": (3160, 256),
              "arduino_dedicated_worker": (3120, 216),
              "arduino_dedicated_thread": (5024, 72),
              "arduino_mixed": (19392, 1192),
          }

          pattern = re.compile(
              r"EDP_THREADING_MEASUREMENT env=(\S+) total=(\d+) intrinsic=(\d+)"
          )

          observed = {}
          for line in Path("resource-summary.log").read_text().splitlines():
              match = pattern.search(line)
              if match:
                  observed[match.group(1)] = (
                      int(match.group(2)),
                      int(match.group(3)),
                  )

          missing = sorted(set(baseline) - set(observed))
          if missing:
              print("Missing measurement rows:", ", ".join(missing))
              sys.exit(1)

          failed = False
          print("RAM comparison (current <= baseline required)")
          for environment, expected in baseline.items():
              current = observed[environment]
              status = "PASS" if current[0] <= expected[0] and current[1] <= expected[1] else "FAIL"
              print(
                  f"{environment}: total {current[0]} <= {expected[0]}, "
                  f"intrinsic {current[1]} <= {expected[1]} [{status}]"
              )
              if status == "FAIL":
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-topology-migration-resource-measurements
          path: |
            resource-summary.log
            EDP-Threading/tests/resource-measurements/.measurement-logs
