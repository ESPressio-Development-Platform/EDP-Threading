[env:esp32dev]
; Use the last pioarduino revision with the coherent esptool 5.3.1 uploader package.
; Builder code is identical to the later SCons-4.11.1 revision; only platform.json changed.
platform = https://github.com/pioarduino/platform-espressif32.git#2f8e8ac3931840b7e9767b79b61184eb29100e3c
board = esp32dev
framework = espidf

; PlatformIO Core 6.2.x requires SCons 4.11.1. Override only SCons while
; leaving this platform revision's native esptool 5.3.1 package untouched.
platform_packages =
    tool-scons @ https://github.com/pioarduino/registry/releases/download/0.0.1/scons-4.11.1.zip

monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Threading.git#main
    https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Clock.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-FreeRTOS.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
