[platformio]
default_envs = esp32dev, esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_compat_mode = off
lib_ldf_mode = deep+
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20
lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Threading.git#feature/profiling-v1
    https://github.com/ESPressio-Development-Platform/EDP-Platform.git#feature/profiling-v1
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-FreeRTOS.git#main
    https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Clock.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Memory.git#main
    https://github.com/ESPressio-Development-Platform/EDP-BoundedTopology.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Persistence.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Security.git#main

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -std=gnu++20
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
