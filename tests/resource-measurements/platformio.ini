[platformio]
default_envs = idf_baseline

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
lib_compat_mode = off
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++20
extra_scripts =
    post:scripts/report_measurement.py
lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Threading.git#main
    https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Clock.git#main
    https://github.com/ESPressio-Development-Platform/EDP-BoundedTopology.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-FreeRTOS.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main

[env:idf_baseline]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=0

[env:idf_small_8x1]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=1

[env:idf_representative_16x2]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=2

[env:idf_control_high]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=3

[env:idf_dedicated_worker]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=4

[env:idf_dedicated_thread]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=5

[env:idf_mixed]
framework = espidf
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=6

[env:arduino_baseline]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=0

[env:arduino_small_8x1]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=1

[env:arduino_representative_16x2]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=2

[env:arduino_control_high]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=3

[env:arduino_dedicated_worker]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=4

[env:arduino_dedicated_thread]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=5

[env:arduino_mixed]
framework = arduino
build_flags =
    -std=gnu++20
    -DEDP_THREADING_MEASUREMENT_SCENARIO=6
